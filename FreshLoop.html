<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FreshLoop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="FreshLoop.css">
</head>
<body>
<header><div class="wrap" style="padding-bottom:0">
  <div class="top"><h1 class="brand">FreshLoop</h1><div class="ticker"><b id="meals">0</b> meals rescued</div></div>
  <div class="chips" id="chips" role="group" aria-label="Dietary filters"></div>
</div></header>

<main class="wrap" id="feed" aria-live="polite"></main>

<section class="wrap" id="claimedSection">
  <div class="section-header" style="margin:28px 0 12px;">
    <h2 style="font-size:22px; margin:0; letter-spacing:-.01em;">Claimed</h2>
  </div>
  <div id="claimedFeed" aria-live="polite"></div>
</section>

<nav><div>
  <button class="tab" aria-current="page">Home</button>
  <button class="post" id="open">+ Post food</button>
</div></nav>

<dialog id="dlg"><form id="f" method="dialog">
  <h2>Post surplus food</h2>
  <label class="drop" id="drop" for="file" tabindex="0"><span id="dropText">Tap to add a photo of the food</span><span id="dropSpinner" class="drop-spinner" aria-hidden="true" style="display:none"></span></label>
  <input type="file" id="file" accept="image/*" hidden>
  <div id="draftHint" class="draft-hint" style="display:none" aria-live="polite"></div>
  <label>What is it?<input id="title" required maxlength="60" placeholder="e.g. Pastries from today’s bake"></label>
  <label>Details<textarea id="desc" rows="2" maxlength="160" placeholder="Items, how it’s packed, where to pick up"></textarea></label>
  <label>Ingredients from label<textarea id="ingredients_text" rows="2" maxlength="4000" placeholder="Upload a clear package label or enter the printed ingredients"></textarea></label>
  <label>Allergen statement from label<textarea id="allergen_statement" rows="2" maxlength="2000" placeholder="Copy printed statements such as Contains or May contain"></textarea></label>
  <label>Pickup address<input id="addr" required maxlength="100" placeholder="Street, city"></label>
  <label>Pickup deadline<input id="deadline" name="pickup_deadline" required maxlength="100" placeholder="e.g. 8:00 PM today"></label>
  <div class="two">
    <label>Servings<input id="serv" type="number" min="1" value="10" required></label>
    <label>Safe for<select id="hrs"><option value="1">1 hour</option><option value="3" selected>3 hours</option><option value="6">6 hours</option><option value="12">12 hours</option></select></label>
  </div>
  <div class="two">
    <label>Min calories per serving<input id="calLow" type="number" min="0" step="1" placeholder="Unknown"></label>
    <label>Max calories per serving<input id="calHigh" type="number" min="0" step="1" placeholder="Unknown"></label>
  </div>
  <div id="calReview" hidden>
    <span aria-live="polite">The serving count changed. Review the calorie estimate.</span>
    <button type="button" id="calConfirm" class="ghost">Keep estimate</button>
  </div>
  <div class="two">
    <label>Food category<select id="category">
      <option value="">Unknown</option>
      <option>Fruit</option><option>Vegetable</option><option>Dairy</option><option>Meat</option><option>Other</option>
    </select></label>
    <label>Vegetarian<select id="vegetarian">
      <option value="unknown">Unknown</option>
      <option value="yes">Yes, I confirm</option>
      <option value="no">No</option>
    </select></label>
  </div>
  <label>Dietary tags<select id="diet"><option value="">None</option><option>Halal</option><option>Nut-free</option></select></label>
  <div id="formError" class="error-msg" style="display:none; color:var(--hot); font-weight:500; font-size:13.5px; margin-top:4px;"></div>
  <div class="acts">
    <button type="button" class="ghost" id="cancel">Cancel</button>
    <button type="submit" class="claim" id="publish" name="publish" value="ok">Publish</button>
  </div>
</form></dialog>

<dialog id="detail"><button class="x" id="dclose" aria-label="Close">✕</button><div id="detailBody"></div></dialog>

<script src="FreshLoop.js"></script>
</body>
</html>

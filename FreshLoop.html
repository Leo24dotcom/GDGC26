<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FreshLoop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="FreshLoop.css">
</head>
<body>
<header><div class="wrap" style="padding-bottom:0">
  <div class="top"><h1 class="brand">FreshLoop</h1><div class="ticker"><b id="meals">0</b> meals rescued</div></div>
  <div class="chips" id="chips" role="group" aria-label="Dietary filters"></div>
</div></header>

<main class="wrap" id="feed" aria-live="polite"></main>

<section class="wrap" id="claimedSection">
  <div class="section-header" style="margin:28px 0 12px;">
    <h2 style="font-size:22px; margin:0; letter-spacing:-.01em;">Claimed</h2>
  </div>
  <div id="claimedFeed" aria-live="polite"></div>
</section>

<nav><div>
  <button class="tab" aria-current="page">Home</button>
  <button class="post" id="open">+ Post food</button>
</div></nav>

<dialog id="dlg"><form id="f" method="dialog">
  <h2>Post surplus food</h2>
  <label class="drop" id="drop" for="file" tabindex="0"><span id="dropText">Tap to add a photo of the food</span><span id="dropSpinner" class="drop-spinner" aria-hidden="true" style="display:none"></span></label>
  <input type="file" id="file" accept="image/*" hidden>
  <div id="draftHint" class="draft-hint" style="display:none" aria-live="polite"></div>
  <details class="post-field">
    <summary><span id="titleLabel">What is it?</span><span class="field-preview"></span></summary>
    <input id="title" aria-labelledby="titleLabel" required maxlength="60" placeholder="e.g. Pastries from today’s bake">
  </details>
  <details class="post-field">
    <summary><span id="descLabel">Details</span><span class="field-preview"></span></summary>
    <textarea id="desc" aria-labelledby="descLabel" rows="2" maxlength="160" placeholder="Items, how it’s packed, where to pick up"></textarea>
  </details>
  <details class="post-field">
    <summary><span id="ingredients_textLabel">Ingredients from label</span><span class="field-preview"></span></summary>
    <textarea id="ingredients_text" aria-labelledby="ingredients_textLabel" rows="2" maxlength="4000" placeholder="Upload a clear package label or enter the printed ingredients"></textarea>
  </details>
  <details class="post-field">
    <summary><span id="allergen_statementLabel">Allergen statement from label</span><span class="field-preview"></span></summary>
    <textarea id="allergen_statement" aria-labelledby="allergen_statementLabel" rows="2" maxlength="2000" placeholder="Copy printed statements such as Contains or May contain"></textarea>
  </details>
  <details class="post-field">
    <summary><span id="addrLabel">Pickup address</span><span class="field-preview"></span></summary>
    <input id="addr" aria-labelledby="addrLabel" required maxlength="100" placeholder="Street, city">
  </details>
  <details class="post-field">
    <summary><span id="deadlineLabel">Pickup deadline</span><span class="field-preview"></span></summary>
    <input id="deadline" aria-labelledby="deadlineLabel" name="pickup_deadline" type="datetime-local" required>
  </details>
  <div class="two">
    <details class="post-field">
      <summary><span id="servLabel">Servings</span><span class="field-preview"></span></summary>
      <input id="serv" aria-labelledby="servLabel" type="number" min="1" value="10" required>
    </details>
    <label>Safe for<select id="hrs"><option value="1">1 hour</option><option value="3" selected>3 hours</option><option value="6">6 hours</option><option value="12">12 hours</option></select></label>
  </div>
  <div class="two">
    <details class="post-field">
      <summary><span id="calLowLabel">Min calories per serving</span><span class="field-preview"></span></summary>
      <input id="calLow" aria-labelledby="calLowLabel" type="number" min="0" step="1" placeholder="Unknown">
    </details>
    <details class="post-field">
      <summary><span id="calHighLabel">Max calories per serving</span><span class="field-preview"></span></summary>
      <input id="calHigh" aria-labelledby="calHighLabel" type="number" min="0" step="1" placeholder="Unknown">
    </details>
  </div>
  <div id="calReview" hidden>
    <span aria-live="polite">The serving count changed. Review the calorie estimate.</span>
    <button type="button" id="calConfirm" class="ghost">Keep estimate</button>
  </div>
  <div class="two">
    <label>Food category<select id="category">
      <option value="">Unknown</option>
      <option>Fruit</option><option>Vegetable</option><option>Dairy</option><option>Meat</option><option>Other</option>
    </select></label>
    <label>Vegetarian<select id="vegetarian">
      <option value="unknown">Unknown</option>
      <option value="yes">Yes, I confirm</option>
      <option value="no">No</option>
    </select></label>
  </div>
  <label>Dietary tags<select id="diet"><option value="">None</option><option>Halal</option><option>Nut-free</option></select></label>
  <div id="formError" class="error-msg" style="display:none; color:var(--hot); font-weight:500; font-size:13.5px; margin-top:4px;"></div>
  <div class="acts">
    <button type="button" class="ghost" id="cancel">Cancel</button>
    <button type="submit" class="claim" id="publish" name="publish" value="ok">Publish</button>
  </div>
</form></dialog>

<dialog id="detail"><button class="x" id="dclose" aria-label="Close">✕</button><div id="detailBody"></div></dialog>

<script src="FreshLoop.js"></script>
</body>
</html>
